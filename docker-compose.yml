name: aralbayev-bexultan-student-api
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: studentsdb
      POSTGRES_USER: student
      POSTGRES_PASSWORD: ${DB_PASSWORD:-student_local_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d studentsdb"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [student_network]
  app:
    build: .
    image: aralbayev-bexultan-student-api:v1.0-aralbayev
    ports: ["8080:8080"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/studentsdb
      DB_USER: student
      DB_PASSWORD: ${DB_PASSWORD:-student_local_only}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [student_network]
volumes:
  postgres_data:
networks:
  student_network:
